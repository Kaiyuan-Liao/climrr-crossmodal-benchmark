[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climrr-crossmodal-benchmark"
version = "0.0.0"
description = "Cross-modal QA benchmark over a ClimRR climate-projection table and a scientific-literature corpus."
requires-python = ">=3.11"
# requirements.txt is the single source of truth for versions (D-004, D-007).
dependencies = ["pandas", "pyyaml", "pypdf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
