[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climrr-crossmodal-benchmark"
version = "0.0.0"
description = "Cross-modal QA benchmark over a ClimRR climate-projection table and a scientific-literature corpus."
requires-python = ">=3.11"
dependencies = ["pandas", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
