# Stopword list v1 --- pilot P2a, DR-LIT-AGG-1 v2 (D-045).
#
# English function words dropped from a statement before content unigrams and
# bigrams are formed (bigrams join tokens adjacent AFTER this removal). Words that
# carry the aggregation's direction (increase, higher, lower, ...) are NOT here,
# nor is "us" (it would drop the country abbreviation US);
# frequent topic words (heat, fire, index, ...) are removed by the per-arm
# document-frequency filter, not by this list.
#
# A change is a new version (stopwords_v2.yaml), never an edit.

