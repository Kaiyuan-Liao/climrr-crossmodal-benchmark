# Infrastructure lexicon v1 (work package P5a; D-070, D-071, D-073). Hash pinned; do not edit in place --- a change is v2.
#
# CLASSIFIES LITERATURE ONLY. It never touches the ClimRR table: no column is renamed, grouped, filtered or described by it.
#
# Asset classes = the 16 critical-infrastructure sectors of CISA (the authoritative taxonomy), names verbatim from the
# CISA sector list. Surface forms are matched whole-word, case-insensitive, no stemming (the run_query.py matcher);
# every plural is listed explicitly. Each form carries its source:
#   source: CISA sector list         --- the phrase appears verbatim on the CISA sector page named in `cisa_page`
#                                        (checked 2026-11-23); the sector page is cited, not interpreted;
#   source: EXECUTOR (common usage)  --- the EXECUTOR's reading of common usage; always `authorization: our_reading`.
# A CISA phrase was left out where it is too generic for whole-word matching in scientific text ("oil", "satellite",
# "wireless", "cable"): recorded under `excluded_cisa_phrases`, not used.
# Impact terms classify what a passage says happens to an asset; they are never a hazard and never a risk.

version: infrastructure_lexicon_v1
decision: "D-070, D-071, D-073 (work package P5a, 2026-11-23)"
used_for: [literature_candidate_classification, statement_asset_class]
never_used_for: [table_columns]
matcher: "whole-word, case-insensitive, no stemming: regexp_matches(text, '\\b' || escape(form) || '\\b', 'i')"
taxonomy:
  name: "CISA critical infrastructure sectors (16)"
  publisher: "Cybersecurity and Infrastructure Security Agency (CISA)"
  page_title: "Critical Infrastructure Sectors | CISA"
  url: "https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors"
  accessed: "2026-11-23"
  sector_pages_read:
    energy: "https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors/energy-sector"
    transportation: "https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors/transportation-systems-sector"
    water: "https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors/water-and-wastewater-sector"
    communications: "https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors/communications-sector"
    dams: "https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors/dams-sector"
  note: "The sector list page gives names only, no per-sector description. Only the five sector pages above were read; forms of the other eleven classes are EXECUTOR (common usage)."

