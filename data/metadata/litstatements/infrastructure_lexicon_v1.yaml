# Transportation, never under Water. EXECUTOR placement, for confirmation.
excluded_cisa_phrases:
  - {phrase: "oil", cisa_page: energy, reason: "too generic for whole-word matching (vegetable oil, oil palm, oil content of fuels)"}
  - {phrase: "satellite", cisa_page: communications, reason: "matches satellite observations / remote sensing in climate papers"}
  - {phrase: "wireless", cisa_page: communications, reason: "matches wireless sensor networks in measurement papers"}

