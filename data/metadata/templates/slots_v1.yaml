# --- [LOCATION] --------------------------------------------------------------
#
# A location is a named set of rows (A-G3) --- never a boundary or a geometry.
location:
  cell:
    column: {index: 1, column: Crossmodel, status: verified_from_dictionary}
    source: {kind: dictionary_line, line: 455, quote: "Crossmodel Truncated name for \"Crossmodel_CellName\". Text ID for each cell in the polygon grid."}
    authorization: verified
    label_format: "R<row>C<col> --- the Crossmodel value as stored"
    assumptions: [A-G0]
    enumeration: the single cell of P-CELL-1
    values:
      - {label: R106C361, wording: grid cell R106C361, prototype: P-CELL-1, source: {kind: prototype_record, record_id: P-CELL-1, field: G.identifier}, authorization: verified}
  county:
    columns:
      - {index: 3, column: State, status: inferred_candidate, ic: IC-012}
      - {index: 2, column: NAME, status: inferred_candidate, ic: IC-011}
    source: {kind: inferred_candidate_records, ids: [IC-011, IC-012]}
    authorization: our_reading
    authorization_note: >-
      A county is the set of rows sharing a (State, NAME) label (A-G1, A-G3) --- the
      reading P-COUNTY-1 uses. Computed and tagged provisional (D-034). The NAME
      label is never a retrieval term.
    assumptions: [A-G1, A-G3, A-AGG1]
    enumeration: the single county of P-COUNTY-1
    values:
      - {label: "Oklahoma|Stephens", state: Oklahoma, name: Stephens, wording: "the cells labelled Stephens, Oklahoma", n_cells: 10, prototype: P-COUNTY-1, source: {kind: prototype_record, record_id: P-COUNTY-1, field: G.identifier}, authorization: our_reading}
  state:
    column: {index: 3, column: State, status: inferred_candidate, ic: IC-012}
    source: {kind: inferred_candidate_record, id: IC-012}
    authorization: inferred_candidate
    authorization_note: >-
      A state is the set of rows sharing a State label (A-G1, A-G3) --- the reading
      P-STATE-1 uses. State is inferred_candidate (IC-012); owner decision
      2026-10-28 (D-034): state-level answers are computed and tagged provisional;
      the conflict with the literal Phase-C rule goes to the COORDINATOR.
    assumptions: [A-G1, A-G3, A-AGG1]
    enumeration_rule: >-
      every distinct non-empty State label with at least min_cells rows. The 7 rows
      with an empty State are not a state name and are excluded.
