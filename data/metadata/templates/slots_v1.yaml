# --- [STATISTIC] -------------------------------------------------------------
#
# Each statistic names a versioned derivation rule. DR-TD-001..003 and 005 reuse
# the prototype arithmetic in src/climrr/phenomenon.py; 004, 006 and 007 are new.
# Every mean is labelled with the M1-WP3b ruling's verbatim phrase.
statistic:
  - id: baseline_value
    wording: value
    rule_id: DR-TD-001
    rule: >-
      The [PERIOD_FROM] column's raw value (cell); otherwise the unweighted mean over
      the member cells non-empty on every column the question reads, rounded to 15
      places half-to-even (phenomenon.mean_from_total).
    reuses: src/climrr/phenomenon.py V.per_column.aggregates.unweighted_mean
    source: {kind: derivation_rule, rule_id: DR-TD-001}
    authorization: our_reading
    assumptions: [A-AGG1, A-G2]
  - id: future_value
    wording: value
    rule_id: DR-TD-002
    rule: as DR-TD-001, on the [PERIOD_TO] column
    reuses: src/climrr/phenomenon.py V.per_column.aggregates.unweighted_mean
    source: {kind: derivation_rule, rule_id: DR-TD-002}
    authorization: our_reading
    assumptions: [A-AGG1, A-G2]
  - id: absolute_change
    wording: absolute change
    rule_id: DR-TD-003
    rule: >-
      Per member cell, the change by the metric's change_operation
      (change_column_value where the pair has a change column, else [PERIOD_TO]
      minus [PERIOD_FROM]), rounded to 15 places; then the unweighted mean over
      cells (cell: the one value).
    reuses: src/climrr/phenomenon.py change_value_of + unweighted_mean (V.change)
    source: {kind: derivation_rule, rule_id: DR-TD-003}
    authorization: our_reading
    assumptions: [A-DIR1, A-AGG1, A-G2]
  - id: percent_change
    wording: percent change
    rule_id: DR-TD-004
    rule: >-
      100 x DR-TD-003 / the [PERIOD_FROM] mean over the same member cells, rounded to
      15 places. A zero denominator gives not_computable (zero_baseline). Never a mean
      of per-cell percent changes (M1-WP3b criterion 7).
    reuses: null
    source: {kind: derivation_rule, rule_id: DR-TD-004}
    authorization: our_reading
    assumptions: [A-DIR1, A-AGG1, A-G2]
  - id: direction
    wording: direction of change
    rule_id: DR-TD-005
    rule: increase / decrease / no_change from the sign of DR-TD-003 (phenomenon.direction_of)
    reuses: src/climrr/phenomenon.py D (direction_of)
    source: {kind: derivation_rule, rule_id: DR-TD-005}
    authorization: our_reading
    assumptions: [A-DIR1]
  - id: comparison
    wording: larger
    rule_id: DR-TD-006
    rule: >-
      Compare two signed values of one statistic: the larger, or `equal`. Signed, as
      PR-1 ranks: a decrease is smaller than no change.
    reuses: null
    source: {kind: derivation_rule, rule_id: DR-TD-006}
    authorization: our_reading
    assumptions: [A-DIR1]
  - id: extremum
    wording: largest / smallest
    rule_id: DR-TD-007
    rule: >-
      Over every enumerated state, the state(s) with the largest (or smallest)
      signed statistic; ties reported as a sorted list; states where the statistic
      is not_computable are excluded and counted.
    reuses: null
    source: {kind: derivation_rule, rule_id: DR-TD-007}
    authorization: our_reading
    assumptions: [A-DIR1, A-AGG1, A-G2, A-G3]
