# Track D v1 --- table-grounded slot vocabularies (D-031, D-033, D-034).
#
# Every slot value a template may be filled with, and nothing else. Each value
# carries a `source` (a dictionary line in data/metadata/dictionary_extracted.txt
# quoted verbatim, a column index of data/raw/FullData.csv, an inferred-candidate
# record, a concept-map entry, or a derivation rule) and an `authorization`:
#
#   verified            the column or passage is `verified_from_dictionary`
#   owner_confirmed     a logged owner resolution (resolutions.yaml); none in v1
#   inferred_candidate  an IC record (inferred_candidates.yaml): not verified,
#                       not owner-confirmed
#   our_reading         an EXECUTOR/prototype reading or derivation rule, recorded
#                       with its assumption ids
#   not_authorized      listed only so that its exclusion is visible; never filled
#
# This file assigns no meaning to any column. It changes no column status, no
# concept-map entry and no compatibility rule. Column statuses are those of
# artifacts/profiles/dictionary_coverage.json; a test checks that no value here
# claims a status stronger than the coverage report records.
#
# Answer computation (src/climrr/templates.py) reads a concept column only if its
# status is verified_from_dictionary or owner_confirmed. Anything weaker makes the
# question `blocked_inferred_columns`. Location slots weaker than `verified` are
# computed and tagged provisional --- owner decision 2026-10-28, D-034.

schema_version: td-slots-v1
authorized_by: [D-031, D-033, D-034]
authorization_vocabulary: [verified, owner_confirmed, inferred_candidate, our_reading, not_authorized]

sources:
  dictionary_text: data/metadata/dictionary_extracted.txt
  concept_map: data/metadata/concept_map.yaml
  dictionary_concepts: data/metadata/dictionary_concepts.yaml
  coverage: artifacts/profiles/dictionary_coverage.json
  inferred_candidates: data/metadata/inferred_candidates.yaml
  resolutions: data/metadata/resolutions.yaml
  table: data/raw/FullData.csv

# --- [CONCEPT] ---------------------------------------------------------------
#
# A concept value is a governed concept-map family plus one metric that realizes
# it in the table. The family is the slot (mentor Q1, D-029: family-level object,
# metric as provenance); the metric is named in the question text so the answer
# is deterministic, and never becomes a retrieval term.
concept:
  governed:
    - id: fire_weather_index
      authorization: inferred_candidate
      authorization_note: >-
        inferred_candidate --- usable for question wording and retrieval only after
        owner confirmation; NOT usable for answer computation. The summer seasonal
        value, difference columns (189-193) are IC-006..IC-010; the question is item
        0 of docs/MENTOR_BRIEF.md (D-033 addendum, item 2).
      source: {kind: concept_map_entry, canonical_id: fire_weather_index, decision_id: D-018,
               dictionary_lines: [292, 293]}
      surface_forms:
        - {term: fire weather index, source: {kind: concept_map_accepted_surface_term, canonical_id: fire_weather_index}, authorization: verified}
        - {term: FWI, source: {kind: concept_map_accepted_surface_term, canonical_id: fire_weather_index}, authorization: verified}
        - {term: fire-weather index, source: {kind: concept_map_additional_surface_term, canonical_id: fire_weather_index, decision_id: D-025}, authorization: verified}
        - {term: canadian forest fire weather index, source: {kind: concept_map_additional_surface_term, canonical_id: fire_weather_index, decision_id: D-025}, authorization: verified}
        - {term: canadian fwi, source: {kind: concept_map_additional_surface_term, canonical_id: fire_weather_index, decision_id: D-025}, authorization: verified}
      caution: >-
        A Fire Weather Index is a meteorological fire-danger index --- never a
        wildfire, an ignition, a burned area or a probability of one.
      metrics:
        - metric_id: fwi_summer_seasonal_value
          wording: seasonal value of the Fire Weather Index (FWI)
          unit: null
          unit_note: the dictionary states no unit for the seasonal value (IC-006 proposes "dimensionless index value", inferred)
          season: summer
          authorization: inferred_candidate
          source: {kind: dictionary_line, line: 661, quote: "Wildfire_summer_hist Seasonal value – Historical"}
          change_operation: change_column_value
          change_operation_source: >-
            P-CELL-1 / P-COUNTY-1 V.change (src/climrr/phenomenon.py VARIABLES,
            fwi_summer_hist_to_end85); assumption A-DIR2
          period_columns:
            historical:   {index: 189, column: wildfire_summer_Hist, status: inferred_candidate, source: {kind: inferred_candidate_record, id: IC-006, line: 661, quote: "Wildfire_summer_hist Seasonal value – Historical"}, authorization: inferred_candidate}
            mid_century:  {index: 190, column: wildfire_summer_Midc, status: inferred_candidate, source: {kind: inferred_candidate_record, id: IC-007, line: 662, quote: "Wildfire_summer_midc Seasonal value – Mid-Century RCP 8.5"}, authorization: inferred_candidate}
            end_century:  {index: 191, column: wildfire_summer_Endc, status: inferred_candidate, source: {kind: inferred_candidate_record, id: IC-008, line: 663, quote: "Wildfire_summer_endc Seasonal value – End-Century RCP 8.5"}, authorization: inferred_candidate}
          change_columns:
            historical->mid_century: {index: 192, column: wildfire_summer_Dmid, status: inferred_candidate, source: {kind: inferred_candidate_record, id: IC-009, line: 664, quote: "Wildfire_summer_Dmid Difference between Mid-Century and Historical"}, authorization: inferred_candidate}
            historical->end_century: {index: 193, column: wildfire_summer_Dend, status: inferred_candidate, source: {kind: inferred_candidate_record, id: IC-010, line: 665, quote: "Wildfire_summer_Dend Difference between End-Century and Historical"}, authorization: inferred_candidate}
          verified_columns_not_used:
            - index: 194
              column: wildfire_summer_Pmid
              status: verified_from_dictionary
              source: {kind: dictionary_line, line: 666, quote: "Wildfire_summer_Pmid Percent Change between Mid-Century and Historical"}
              authorization: verified
              reason_not_used: >-
                its field entry states no scenario (P-CELL-1 C.per_role
                corroborating_change: unknown), so it cannot fill [SCENARIO]; and a
                per-cell percent change may not be averaged (M1-WP3b criterion 7).
                Open question for the COORDINATOR (report field 9).
            - index: 195
              column: wildfire_summer_Pend
              status: verified_from_dictionary
              source: {kind: dictionary_line, line: 667, quote: "Wildfire_summer_Pend Percent Change between End-Century and Historical"}
              authorization: verified
              reason_not_used: same as index 194
      seasons_excluded:
        - season: autumn
          columns: [175, 176, 177, 178, 179]
          status: partially_resolved
          source: {kind: dictionary_line, line: 647, quote: "Wildfire_autumn_hist Seasonal value – Historical"}
          authorization: not_authorized
          reason: the value and difference columns are partially_resolved --- weaker than inferred_candidate
        - season: spring
          columns: [182, 183, 184, 185, 186]
          status: partially_resolved
          source: {kind: dictionary_line, line: 654, quote: "Wildfire_spring_hist Seasonal value – Historical"}
          authorization: not_authorized
          reason: as autumn
        - season: winter
          columns: [196, 197, 198, 199, 200]
          status: partially_resolved
          source: {kind: dictionary_line, line: 668, quote: "Wildfire_winter_hist Seasonal value – Historical"}
          authorization: not_authorized
          reason: as autumn

    - id: heat_index
      authorization: verified
      source: {kind: concept_map_entry, canonical_id: heat_index, decision_id: D-018,
               dictionary_lines: [390, 391]}
      surface_forms:
        - {term: heat index, source: {kind: concept_map_accepted_surface_term, canonical_id: heat_index}, authorization: verified}
        - {term: heat-index, source: {kind: concept_map_additional_surface_term, canonical_id: heat_index, decision_id: D-025}, authorization: verified}
        - {term: extended heat index, source: {kind: concept_map_additional_surface_term, canonical_id: heat_index, decision_id: D-025, status: approved_family_term}, authorization: verified, note: "collection and retrieval only; not a synonym of heat index"}
      metric_note: >-
        Four threshold metrics, all verified_from_dictionary (owner decision
        2026-10-28, D-034: enumerate all four). The threshold appears in the question
        text as the metric's name (D-033 addendum, item 4) and is never a retrieval
        term. The metric-level concept-map entry heatindex_days_above_105F stays
        `proposed`; nothing here approves it.
      metrics:
        - metric_id: heatindex_days_above_95F
          wording: number of days with daily max heat index above 95 F
          unit: days
          season: summer
          authorization: verified
          source: {kind: dictionary_line, line: 679, quote: "heatindex_HIS_Day95 Number of Summer days with daily max heat index above 95 F -- Historical"}
          change_operation: difference_of_horizon_values
          change_operation_source: P-STATE-1 V.change (src/climrr/phenomenon.py, CHANGE_FROM_DIFFERENCE); assumption A-DIR1
          period_columns:
            historical:  {index: 240, column: heatindex_HIS_Day95, status: verified_from_dictionary, source: {kind: dictionary_line, line: 679, quote: "heatindex_HIS_Day95 Number of Summer days with daily max heat index above 95 F -- Historical"}, authorization: verified}
            mid_century: {index: 246, column: heatindex_M85_Day95, status: verified_from_dictionary, source: {kind: dictionary_line, line: 685, quote: "heatindex_M85_Day95 Number of Summer days with daily max heat index above 95 F -- Mid-Century RCP8.5"}, authorization: verified}
            end_century: {index: 252, column: heatindex_E85_Day95, status: verified_from_dictionary, source: {kind: dictionary_line, line: 694, quote: "heatindex_E85_Day95 Number of Summer days with daily max heat index above 95 F -- End-Century RCP8.5"}, authorization: verified}
          change_columns: {}
        - metric_id: heatindex_days_above_105F
          wording: number of days with daily max heat index above 105 F
          unit: days
          season: summer
          authorization: verified
          source: {kind: dictionary_line, line: 680, quote: "heatindex_HIS_Day105 Number of Summer days with daily max heat index above 105 F -- Historical"}
          change_operation: difference_of_horizon_values
          change_operation_source: P-STATE-1 V.change (src/climrr/phenomenon.py, CHANGE_FROM_DIFFERENCE); assumption A-DIR1
          period_columns:
            historical:  {index: 241, column: heatindex_HIS_Day105, status: verified_from_dictionary, source: {kind: dictionary_line, line: 680, quote: "heatindex_HIS_Day105 Number of Summer days with daily max heat index above 105 F -- Historical"}, authorization: verified}
            mid_century: {index: 247, column: heatindex_M85_Day105, status: verified_from_dictionary, source: {kind: dictionary_line, line: 686, quote: "heatindex_M85_Day105 Number of Summer days with daily max heat index above 105 F -- Mid-Century RCP8.5"}, authorization: verified}
            end_century: {index: 253, column: heatindex_E85_Day105, status: verified_from_dictionary, source: {kind: dictionary_line, line: 695, quote: "heatindex_E85_Day105 Number of Summer days with daily max heat index above 105 F -- End-Century RCP8.5"}, authorization: verified}
          change_columns: {}
        - metric_id: heatindex_days_above_115F
          wording: number of days with daily max heat index above 115 F
          unit: days
          season: summer
          authorization: verified
          source: {kind: dictionary_line, line: 681, quote: "heatindex_HIS_Day115 Number of Summer days with daily max heat index above 115 F -- Historical"}
          change_operation: difference_of_horizon_values
          change_operation_source: P-STATE-1 V.change (src/climrr/phenomenon.py, CHANGE_FROM_DIFFERENCE); assumption A-DIR1
          period_columns:
            historical:  {index: 242, column: heatindex_HIS_Day115, status: verified_from_dictionary, source: {kind: dictionary_line, line: 681, quote: "heatindex_HIS_Day115 Number of Summer days with daily max heat index above 115 F -- Historical"}, authorization: verified}
            mid_century: {index: 248, column: heatindex_M85_Day115, status: verified_from_dictionary, source: {kind: dictionary_line, line: 687, quote: "heatindex_M85_Day115 Number of Summer days with daily max heat index above 115 F -- Mid-Century RCP8.5"}, authorization: verified}
            end_century: {index: 254, column: heatindex_E85_Day115, status: verified_from_dictionary, source: {kind: dictionary_line, line: 696, quote: "heatindex_E85_Day115 Number of Summer days with daily max heat index above 115 F -- End-Century RCP8.5"}, authorization: verified}
          change_columns: {}
        - metric_id: heatindex_days_above_125F
          wording: number of days with daily max heat index above 125 F
