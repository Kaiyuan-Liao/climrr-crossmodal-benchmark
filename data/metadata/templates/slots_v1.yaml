          authorization: verified
          source: {kind: dictionary_line, line: 682, quote: "heatindex_HIS_Day125 Number of Summer days with daily max heat index above 125 F -- Historical"}
          change_operation: difference_of_horizon_values
          change_operation_source: P-STATE-1 V.change (src/climrr/phenomenon.py, CHANGE_FROM_DIFFERENCE); assumption A-DIR1
          period_columns:
            historical:  {index: 243, column: heatindex_HIS_Day125, status: verified_from_dictionary, source: {kind: dictionary_line, line: 682, quote: "heatindex_HIS_Day125 Number of Summer days with daily max heat index above 125 F -- Historical"}, authorization: verified}
            mid_century: {index: 249, column: heatindex_M85_Day125, status: verified_from_dictionary, source: {kind: dictionary_line, line: 688, quote: "heatindex_M85_Day125 Number of Summer days with daily max heat index above 125 F -- Mid-Century RCP8.5"}, authorization: verified}
            end_century: {index: 255, column: heatindex_E85_Day125, status: verified_from_dictionary, source: {kind: dictionary_line, line: 697, quote: "heatindex_E85_Day125 Number of Summer days with daily max heat index above 125 F -- End-Century RCP8.5"}, authorization: verified}
