# NCA5 climate regions --- state -> region map v1 (pilot P1; GUIDANCE re-anchor
# ruling 2026-10-29, ruling 3; D-041).
#
# One regionalization scheme for the pilot. The map is fixed BEFORE any table
# pattern is computed and is pinned by SHA-256 in data/manifest.json. Membership
# is NEVER edited to improve a pattern; the only admissible reason to change it is
# the source, and a change is a new version (nca_regions_v2.yaml), never an edit.
#
# Labels here are the State labels exactly as data/raw/FullData.csv stores them
# (column 3 `State`, inferred_candidate IC-012). The map assigns no meaning to the
# column; it says only which NCA5 region a label belongs to.
#
# A set of states that is not one of these regions is a `multi_state_set` and is
# never called a climate region.

region_scheme_id: NCA5
region_scheme_name: Fifth National Climate Assessment regions (U.S. Global Change Research Program)
region_scheme_version: NCA5 (2023)
map_version: nca_regions_v1

source_citation:
  report: >-
    USGCRP, 2023: Fifth National Climate Assessment. Crimmins, A.R., C.W. Avery,
    D.R. Easterling, K.E. Kunkel, B.C. Stewart, and T.K. Maycock, Eds. U.S. Global
    Change Research Program, Washington, DC, USA. https://doi.org/10.7930/NCA5.2023
  regional_definition: >-
    The ten regional chapters, Part III "Regions": Ch. 21 Northeast, Ch. 22
    Southeast, Ch. 23 U.S. Caribbean, Ch. 24 Midwest, Ch. 25 Northern Great Plains,
    Ch. 26 Southern Great Plains, Ch. 27 Northwest, Ch. 28 Southwest, Ch. 29
    Alaska, Ch. 30 Hawai'i and U.S.-Affiliated Pacific Islands; the regional map in
    the Front Matter "Guide to the Report".
  url: https://nca2023.globalchange.gov/
  accessed_from_this_machine: false
  access_note: >-
    2026-10-29: the host nca2023.globalchange.gov did not resolve from the
    EXECUTOR's machine (getaddrinfo ENOTFOUND). The membership below is written
    from the EXECUTOR's knowledge of the NCA5 regional chapters, not read from the
    artifact.

source_verification: pending_kaiyuan
verification_required:
  who: Kaiyuan Liao
  artifact: >-
    NCA5 (https://doi.org/10.7930/NCA5.2023): the opening "Introduction" or
    overview of each regional chapter 21-30 (each names its member states), or the
    regional map in the Front Matter "Guide to the Report". If the
    globalchange.gov site is unavailable, the NCA5 full-report PDF at the DOI.
  what_to_check: >-
    For every state below, that it belongs to exactly the region named; in
    particular the border cases Northeast vs Southeast (West Virginia, Maryland,
    Delaware, Virginia, Kentucky), Midwest vs Great Plains (Missouri, Kansas,
    Nebraska) and Southwest vs Northwest/Great Plains (Colorado, Utah, Wyoming).
  on_mismatch: >-
    Do not edit this file: report the mismatch; a corrected map is
    nca_regions_v2.yaml with a new manifest pin and a decision-log entry.

regions:
  - {region_id: NCA5-NE, name: Northeast, chapter: 21}
  - {region_id: NCA5-SE, name: Southeast, chapter: 22}
  - {region_id: NCA5-CAR, name: U.S. Caribbean, chapter: 23, note: Puerto Rico and the U.S. Virgin Islands --- no state}
  - {region_id: NCA5-MW, name: Midwest, chapter: 24}
  - {region_id: NCA5-NGP, name: Northern Great Plains, chapter: 25}
  - {region_id: NCA5-SGP, name: Southern Great Plains, chapter: 26}
  - {region_id: NCA5-NW, name: Northwest, chapter: 27}
  - {region_id: NCA5-SW, name: Southwest, chapter: 28}
  - {region_id: NCA5-AK, name: Alaska, chapter: 29}
  - {region_id: NCA5-HI, name: "Hawai'i and U.S.-Affiliated Pacific Islands", chapter: 30}

# 50 states + the District of Columbia, each in exactly one region.
