- id: DC-003
  name: Precipitation
  name_source:
    page: 7
    char_span: [1696, 1709]
  passage: "Argonne calculated total annual precipitation \nby adding all 3-hour precipitation estimates\
    \ for a given year (e.g., 2045) within a given time \nperiod/scenario (e.g., mid-century RCP4.5) and\
    \ for a given climate model (e.g., CCSM), which produced \nthe total annual precipitation for that\
    \ scenario's model year, such as CCSM's estimate of annual \nprecipitation in 2045 under climate scenario\
    \ RCP4.5. This process was repeated for each year within a \ngiven time period/scenario (e.g., 2046,\
    \ 2047, and so forth) and across all three climate models (CCSM, \nGFDL, and HadGEM), producing a\
    \ total of 30 estimates of total annual precipitation for a given time \nperiod/scenario. The average\
    \ of these values was taken to produce the ensemble mean of the total annual \nprecipitation (in inches)\
    \ for each time period/scenario."
  page: 7
  char_span: [2082, 2895]
  units: inches
  metric_or_threshold: null
  scenario_or_horizon: null
