- id: DC-004
  name: Wind Speed
  name_source:
    page: 7
    char_span: [2899, 2909]
  passage: "Each climate model generates estimated wind speed readings (in miles per hour, or mph) every\
    \ 3 hours, \nor 8 wind speed readings per day. These values are irrespective of wind direction and\
    \ only represent the \nmagnitude of wind speed. Using these readings, Argonne calculated the average\
    \ daily wind speed (the \naverage of each day's 8 wind speed readings) for every day within a given\
    \ time period/scenario (e.g., mid-\ncentury RCP4.5) and for each climate model (CCSM, GFDL, and HadGEM).\
    \ Argonne then took the \naverage of each daily average wind speed for a given year (e.g., 2045) within\
    \ a given time period/scenario \n(e.g., mid-century RCP4.5) and for a given climate model (e.g., CCSM),\
    \ which produced the annual \naverage wind speed for that scenario's model year, such as CCSM's estimate\
    \ of annual average wind \nspeeds in 2045 under climate scenario RCP4.5. This process was repeated\
    \ for each year within a given \ntime period/scenario (e.g., 2046, 2047, and so forth) and across\
    \ all three climate models (CCSM, GFDL, \nand HadGEM), producing a total of 30 estimates of annual\
    \ average wind speeds for a given time \nperiod/scenario. The average of these values was taken to\
    \ produce the ensemble mean of the annual \naverage wind speed (in mph) for each time period/scenario."
  page: 7
  char_span: [2911, 4183]
  units: mph
  metric_or_threshold: null
