- id: DC-006
  name: Degree Days (HDD/CDD)
  name_source:
    page: 8
    char_span: [1856, 1877]
  passage: "Degree days measure how cold or warm a location is by comparing the daily average temperature\
    \ to a \nreference temperature, usually 65°F (18.33°C). Heating or cooling degree days roughly correlate\
    \ with \nbuilding heating or cooling needs, providing a simple useful estimate in energy planning.\
    \ Heating degree \ndays (HDD) measure how cold the temperature was on a given day or period of days,\
    \ which shapes the \nneed for a certain amount of building heating. For example, a day with an average\
    \ temperature of 40°F \nhas 25 HDD (65 - 40 = 25 HDD). Similarly, cooling degree days (CDD) measure\
    \ how hot the \ntemperature was on a given day; a day with an average temperature of 90°F has 25 CDD\
    \ (90 – 65 = 25 \nCDD)."
  page: 8
  char_span: [1879, 2584]
  units: null
  metric_or_threshold: 65°F (18.33°C)
  scenario_or_horizon: null
  family_hint: null
  verified_columns: []
  status: dictionary_described
- id: DC-007
  name: Fire Weather Index
  name_source:
    page: 8
    char_span: [3846, 3864]
  passage: "Argonne calculated the average daily FWI value by season for each year within a given scenario\
    \ (e.g., \nmid-century RCP4.5) and climate model (e.g., CCSM). The seasons are segmented as winter\
    \ (Dec, Jan, \nFeb), spring (March, April, May), summer (June, July, Aug), and autumn (Sep, Oct, Nov).\
    \ Each year’s \nseasonal average daily FWI was used to calculate a decadal average daily FWI value\
    \ for that season (e.g., \nthe average daily FWI value in winter at mid-century under RCP4.5). This\
    \ process was repeated across all \nscenarios and all three climate models (CCSM, GFDL, and HadGEM),\
    \ followed by calculating the multi-\nmodel ensemble mean of each scenario’s seasonal average daily\
    \ FWI value."
  page: 10
  char_span: [0, 689]
  units: null
  metric_or_threshold: null
  scenario_or_horizon: null
  family_hint: null
  verified_columns: []
  status: dictionary_described
- id: DC-008
  name: Calculating FWI Classes
  name_source:
    page: 10
    char_span: [795, 818]
  passage: "Daily FWI values were used to calculate seasonal and annual 95th percentile FWI values for\
    \ all grid cells, \nacross historical, mid-century RCP8.5, and end-of-century RCP8.5 scenarios. These\
    \ 95th percentile FWI \nvalues capture the extremes that a region may experience with some regularity\
    \ (i.e., the FWI values do \nnot represent rare, one-off maximums). \nGrid cell-level 95th percentile\
    \ values were used to create classes of relative fire danger across the \ncontinental United States,\
    \ with classes for each decade (e.g., historical FWI class) and for each season \n(e.g., winter historical\
    \ FWI class)."
  page: 10
  char_span: [821, 1421]
  units: null
  metric_or_threshold: 95th percentile
  scenario_or_horizon: historical, mid-century RCP8.5, and end-of-century RCP8.5
  family_hint: null
