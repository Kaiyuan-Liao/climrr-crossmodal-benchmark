- id: DC-001
  name: Temperature (Annual)
  name_source:
    page: 6
    char_span: [125, 145]
  passage: "Each climate model generates temperature readings every 3 hours, or 8 temperature readings\
    \ per day. The \nmaximum daily temperature refers to the highest of these 8 readings, which often\
    \ occurs in the middle of \nthe daytime and is comparable to the 'high temperature' in a daily weather\
    \ forecast. Similarly, the \nminimum daily temperature refers to the lowest of these 8 readings, which\
    \ often occurs overnight and is \ncomparable to the 'low temperature' in a daily weather forecast.\
    \ Argonne calculated the annual average of \nboth the maximum and minimum daily temperatures."
  page: 6
