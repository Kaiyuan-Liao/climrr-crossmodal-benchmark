- id: DC-005
  name: Consecutive Days with No Precipitation
  name_source:
    page: 8
    char_span: [0, 38]
  passage: "Using this information, Argonne identified \nthe greatest number of consecutive days in which\
    \ no precipitation occurred (i.e., the total daily \nprecipitation quantity equaled zero) for that\
    \ scenario's model year (e.g., for the year 2045 under scenario \nRCP4.5, the highest number of consecutive\
    \ days without any precipitation was X). This process was \nrepeated for each year within a given\
    \ time period/scenario (e.g., 2046, 2047, and so forth) and across all \nthree climate models (CCSM,\
    \ GFDL, and HadGEM) producing 10 yearly values for each model, with \neach value representing the\
    \ longest consecutive span with no precipitation for that year. Of the 10 yearly \nvalues for each\
    \ climate model, the maximum value was selected (e.g., the decadal maximum). This \nresulted in 3\
    \ values for the longest consecutive number of days without precipitation for each time \nperiod/scenario,\
    \ with one value for each climate model’s 10 years of data. The average of these maximum \nof the\
    \ maxima was then taken to produce the ensemble mean of the decade’s highest number of \nconsecutive\
    \ days without precipitation in a single year."
  page: 8
  char_span: [738, 1852]
  units: null
  metric_or_threshold: "the total daily \nprecipitation quantity equaled zero"
  scenario_or_horizon: null
  family_hint: null
