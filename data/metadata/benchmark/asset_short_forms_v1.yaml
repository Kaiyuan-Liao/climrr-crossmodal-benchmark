# Asset-class short forms v1 (work package litsynth v5.4, D-075a rule 2). Hash pinned; a change is v2.
#
# Rung-8 answer shape v2 names the packet's asset class once, in full (the `asset_class_phrase` of
# climrr.synthpackets_infra.ASSET_CLASS_PHRASE), in the first impact sentence; a later impact sentence may name it by the
# full phrase or by one of the short forms below. Packets v1b carry the class's short forms (`asset_class_short_forms`);
# post-checks v3.5 accept them in later impact sentences only.
#
# Source: the work package gives three examples ("the grid", "roads and rail", "hospitals and emergency services"). The
# EXECUTOR assigned them to classes (energy, transportation_systems, healthcare_and_public_health) and wrote the remaining
# short forms; every assignment and every other entry is for COORDINATOR confirmation. Wording only: no column, status or
# concept is touched.
version: asset_short_forms_v1
decision: D-075a
classes:
  energy:
    full: energy systems
    short: ["the grid", "power systems"]
  transportation_systems:
    full: transportation systems
    short: ["roads and rail"]
  water_and_wastewater:
    full: water and wastewater systems
    short: ["water systems"]
  healthcare_and_public_health:
    full: healthcare and public health systems
    short: ["hospitals and emergency services", "hospitals"]
  emergency_services:
    full: emergency services
    short: ["emergency responders"]
  communications:
    full: communications systems
    short: ["communications networks"]
