# Plain-language phrases v1a for the graded text of a benchmark item (D-060, D-061, D-062; P3a hotfix D-053b).
#
# v1 (plain_language_v1.yaml, kept unchanged as the evidence for packets v4) with the fire-weather quantity phrase the P3a
# hotfix gives, and the words a fire-weather item's graded text never uses. Everything else is as in v1.
#
# The graded text of an item (the question, the reference answer, the rubric) names no RCP label, no threshold number and
# no years. It names the quantity, the scenario and the horizon with the phrases below; the exact threshold, scenario,
# windows and values stay in the item's provenance (reference_components) only. One threshold per place per item set
# (D-060), so the plain quantity phrase cannot be ambiguous within a set.
#
# src/climrr/plain_language.py reads this file only when its bytes match the manifest pin; the seed packets v4a carry the
# phrases (model_view.plain_language), litsynth_agent v4 must use them, and synthesis_post_checks v3 forbids what they
# replace. Pinned by SHA-256 in data/manifest.json; a change is a new file with its own decision.
#
# Marked EXECUTOR: a detail the work package does not fix, recorded for confirmation.
#
# No column is interpreted here. The fire-weather phrase follows the standing caution: a Fire Weather Index is a
# meteorological fire-danger index, never fire occurrence.

version: plain_language_v1a
decision: D-060, D-053b

families:
  heat_index:
    quantity: "days hot and humid enough to be dangerous"        # the work package, verbatim
    quantity_short: "dangerous heat-index days"                  # the work package, verbatim
    season_unit: "a summer"                                      # the coarse anchor pair ends "... days a summer"
  fire_weather_index:
    quantity: "fire-weather danger (how hot, dry and windy conditions favour fire)"   # P3a hotfix, verbatim
    quantity_short: "fire-weather danger"                        # v1; EXECUTOR: the hotfix gives the long phrase only
    season_unit: null                                            # EXECUTOR: an index value has no countable unit; no anchor pair
    # P3a hotfix: never in a fire-weather item's graded text (synthesis_post_checks v3: FWI_FORBIDDEN_RE, a failure);
    # "fire" alone outside the phrases above is reported, not failed (FWI_FIRE_WORD_RE).
    never_write: ["wildfire", "fires", "burned area"]

scenario:
  RCP8.5: "under a high-emissions future"                        # D-061: the only scenario words in graded text

horizon:
  mid: "by mid-century"
  end: "by late this century"

# D-062: the hedge in graded text follows the evidence strength of the groups a sentence rests on. The strength label itself
# is unchanged in provenance and rubric.
hedges:
  multi_source_supported: ["research shows", "research has shown"]
  review_supported: ["research shows", "research has shown"]     # D-062: "or review"
  single_source_supported: ["research suggests"]
  never: ["one study", "a single study"]
