# Inferred-candidate records --- the reasoning behind every column the M1-WP3
# pilot interprets without the dictionary having said it (D-010, D-011).
#
# An `inferred_candidate` is, in the GUIDANCE ruling's words:
#
#     A reasoned interpretation judged plausible enough to test in an example,
#     but not established as source truth.
#
# It is the weakest of the three statuses a pilot column may hold, and the
# whole point of writing these records down is that it stays visibly weaker:
#
#     verified_from_dictionary  !=  owner_confirmed  !=  inferred_candidate
#
# What a record must do
# ---------------------
# One record, one column. Membership in a family, in `STEM_SECTION_CANDIDATES`,
# or in any other EXECUTOR-authored map is **not** a reason --- those stay
# navigation aids exactly as D-009 left them. Each record has to quote the
# dictionary text it reasons from, say what the column *name* contributes, say
# what the *values* contribute (from the WP1 profile, which records facts about
# characters and none about climate), give the reasoning for this column, and
# then list what it still does not know.
#
# `alternatives_unresolved` is not a formality. It is where a record admits the
# readings it cannot rule out, and it is the field the mentor should read first.
#
# Field by field
# --------------
#   id                  IC-001, IC-002, ... Assigned in order, never reused.
#   column_index        0-based ordinal in data/raw/FullData.csv. The key.
#   column_name         The exact header text. Checked against the table on
#                       every run; a mismatch raises rather than being ignored.
#   proposed_meaning    What this column is proposed to hold.
#   proposed_unit       } each null, or {value, provenance}. `provenance` is
#   proposed_scenario   } `from_dictionary` when a cited span states it, and
#   proposed_horizon    } `inferred` when the EXECUTOR reasoned it. A null is a
#   proposed_season     } deliberate "this record does not claim to know".
#   dictionary_spans    Line-numbered verbatim quotes of
#                       data/metadata/dictionary_extracted.txt. Required and
#                       non-empty --- including where the quoted text is exactly
#                       what fails to state the attribute being inferred.
#   name_evidence       What the column name itself contributes.
#   value_evidence      range / emptiness / distinct, quoted from
#                       artifacts/profiles/fulldata_profile.json.
#   reasoning           Why, for this column. Required and non-empty.
#   alternatives_unresolved  Readings this record cannot rule out.
#   assumptions         What the record leans on that is not established.
#   question_ids        The open questions in docs/METADATA_QUESTIONS.md.
#   status              Always the literal `inferred_candidate`.
#   disclaimer          Always "not verified, not owner-confirmed".
#
# Three rules the code enforces, not conventions
# ----------------------------------------------
#   1. A record with no `dictionary_spans`, or with no `reasoning`, is refused.
#      Between them they are what separates a recorded inference from a guess.
#   2. A record never overrides `verified_from_dictionary` or `owner_confirmed`.
#      Aimed at such a column it is reported as blocked and changes nothing.
#   3. No resolution record may assign `inferred_candidate`, and no record here
#      may assign anything else. Promotion to `owner_confirmed` happens only in
#      data/metadata/resolutions.yaml, by a record naming the column and saying
#      exactly what the mentor confirmed.
#
# Two cautions that apply to every record below
# ---------------------------------------------
#   * `Historical` everywhere in this file means a **modeled historical
#     baseline** --- the dictionary's own historical period, 1995-2004, run
#     through the same models (lines 101-102, 149). It is never an observation,
#     a measurement, or a record of what happened.
#   * The `wildfire_*` columns hold a **Fire Weather Index** --- a
#     meteorological fire-danger index. No record here, and no text generated
#     from one, may read an FWI value as a fire, an ignition, a burned area, or
#     a probability of any of those.

