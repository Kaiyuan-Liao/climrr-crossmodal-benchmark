  - item_id: BI-P3-0004
    label: Alabama heat
    reason: "\"They will move\" states a projection as certainty; sentences fragmented; hedge cover lost"
    display_answer: "In Alabama, summer days hot and humid enough to be dangerous are projected to increase, going from rare to common by late this century under a high‑emissions future, a larger change than in most states. Research shows that large‑scale warming drives the increase, that global warming raises heat‑wave frequency and intensity, and that intensified urban heat islands at night add to dangerous heat‑index days."
  - item_id: BI-P3-0003
    label: Washington heat
    reason: "broken sentence \"The projection is for by mid-century\"; hedge cover lost"
    display_answer: "In Washington, dangerous heat‑index days are projected to increase slightly but remain rare by mid-century under a high‑emissions future, a smaller change than in most states. Research shows that large‑scale warming drives the increase and that the urban heat island effect intensifies night‑time heat, adding to the projected rise."
  - item_id: BI-P3-0002
    label: New York heat
    reason: "\"They will go\", \"The change will occur\" state certainty; hedge cover lost"
    display_answer: "In New York, summer days hot and humid enough to be dangerous are projected to go from rare to common by late this century under a high-emissions future, a smaller change than in most states. Research shows that large‑scale warming drives this increase, that global warming raises heat‑wave frequency and intensity, and that intensified urban heat islands at night add to dangerous heat‑index days."
  - item_id: BI-P3-0005
    label: regions heat
    reason: "question did not ask about regional differences; hedge cover lost"
    display_prompt: "How are dangerous heat-index days in summer projected to change by mid-century under a high-emissions future, how do the changes differ across U.S. regions, and what drives them?"
    display_answer: "Dangerous heat-index days in summer are projected to increase across U.S. regions by mid-century under a high-emissions future, with the largest increase in the Southeast and essentially no change in Alaska. Research shows that large‑scale warming is the primary driver of future extreme heat, that global warming raises heat‑wave frequency and intensity, and that the urban heat island effect adds to heat stress, especially at night."
  - item_id: BI-P3-0007
    label: California fire weather
    reason: "\"strong winds\" stated twice; four one-line sentences; \"The change occurs\" states certainty"
    display_answer: "In California during summer, fire‑weather danger is projected to increase slightly by mid‑century under a high‑emissions future, a larger change than in most states. Research shows that strong winds, low humidity, and higher temperatures that dry out fuels are the main drivers of fire‑weather danger, with drier air (a higher vapor‑pressure deficit) adding to it."
