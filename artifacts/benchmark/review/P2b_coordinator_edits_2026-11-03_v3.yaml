    label: "Georgia, rung 1"
    change: unchanged from v1
    edited_prompt: "How is the number of summer days with a dangerous heat index (above 95 °F) expected to change in Georgia by mid-century under RCP8.5, and roughly how large is the change?"
    edited_reference_integrated: "In Georgia, the number of summer days with a dangerous heat index (above 95 °F) is projected to increase by mid-century (2045–2054) under RCP8.5, roughly tripling relative to the modeled historical baseline. RCP8.5 is one high-emissions scenario, not a forecast, and the baseline is model output, not an observation."
  - n: 2
    item_id: BI-P2B-0003
    label: "California, rung 3"
    change: answer replaced; question unchanged from v1
    cites: "driver-c1-008 [corrected member], driver-c2-001, the Southwest feedback member. Urban-heat-island clause removed."
    edited_prompt: "How is the summer frequency of days with a dangerous heat index (above 95 °F) expected to change in California by mid-century under RCP8.5, and what are the main physical drivers of this change?"
    edited_reference_integrated: "California is projected to see a moderate increase (about half again as many) in summer days with a dangerous heat index (above 95 °F) by mid-century (2045–2054) under RCP8.5, one high-emissions scenario. Warming drives the change: one study, citing earlier CMIP5 work, identifies large-scale warming rather than changes in regional circulation as the primary driver of future changes in extreme heat, and global warming is expected to increase the frequency, intensity and duration of heat waves. One study suggests that land–atmosphere feedbacks appear to be a stronger factor in sustaining heat waves at southern latitudes."
  - n: 3
    item_id: BI-P2B-0006
    label: "Alabama, rung 3"
    change: answer replaced; question unchanged from v1
    cites: "driver-c2-001, driver-c1-008 [corrected], mechanism-c1-021 for the definition clause, mechanism-c2-003. Urban clause removed."
    edited_prompt: "How is the summer frequency of days with a dangerous heat index (above 105 °F) expected to change in Alabama by the end of the century under RCP8.5, and what are the main physical drivers of this change?"
    edited_reference_integrated: "In Alabama, summer days with a dangerous heat index (above 105 °F) are projected to rise from rare — about 1 day per summer in the modeled historical baseline — to about 45 days by the end of the century (2085–2094) under RCP8.5, one high-emissions scenario. The rise is driven by warming: global warming is expected to increase the frequency, intensity and duration of heat waves, and one study, citing earlier CMIP5 work, identifies large-scale warming rather than regional circulation change as the primary driver of future changes in extreme heat. Because the heat index combines temperature and humidity, one study suggests the magnifying effect of humidity on heat stress grows as temperatures rise."
  - n: 4
    item_id: BI-P2B-0007
    label: "NCA5 regions, rung 4"
    change: question and answer replaced
    cites: "(Table side must state which two regions are not covered.)"
    edited_prompt: "How will the number of summer days with a dangerous heat index (above 95 °F) change by mid-century under RCP8.5 across the U.S. NCA5 climate regions — which region is projected to see the largest increase and where is the change smallest — and what are the main physical drivers?"
    edited_reference_integrated: "By mid-century (2045–2054) under RCP8.5, one high-emissions scenario, summer days with a dangerous heat index (above 95 °F) increase in the eight NCA5 climate regions covered, with the largest increase in the Southeast and essentially no change in Alaska. The increases are driven by warming: global warming is expected to raise heat-wave frequency, intensity and duration, and one study, citing earlier CMIP5 work, identifies large-scale warming rather than regional circulation change as the primary driver of future changes in extreme heat. One study finds that land–atmosphere feedbacks appear to be a stronger factor for heat-wave maintenance at southern latitudes, and one study suggests that humidity magnifies heat stress more as temperatures rise."
  - n: 5
    item_id: BI-P2B-0010
    label: "Florida, rung 7, run 3"
    change: answer replaced; question unchanged from v1
    cites: "(The \"table used here\" clause is removed.)"
    edited_prompt: "How is the number of summer days with a dangerous heat index (above 95 °F) in Florida expected to change by mid-century under a high-emissions scenario compared with a moderate one, and what are the main drivers and uncertainties?"
    edited_reference_integrated: "Under RCP8.5, one high-emissions scenario, Florida's summer days with a dangerous heat index (above 95 °F) are projected to roughly triple by mid-century (2045–2054). Warming drives the change: global warming is expected to raise heat-wave frequency, intensity and duration, and one study, citing earlier CMIP5 work, identifies large-scale warming rather than regional circulation change as the primary driver of future changes in extreme heat; one study suggests that humidity's magnifying effect on heat stress grows with temperature. Projections differ between emissions pathways: one study reports heat-wave duration almost one day longer under RCP8.5 than under the moderate RCP4.5 scenario. RCP8.5 should be read as one plausible high-emissions future, not a forecast."
