items:
  - n: 1
    item_id: BI-P2B-0001
    label: "Georgia, rung 1"
    edited_prompt: "How is the number of summer days with a dangerous heat index (above 95 °F) expected to change in Georgia by mid-century under RCP8.5, and roughly how large is the change?"
    edited_reference_integrated: "In Georgia, the number of summer days with a dangerous heat index (above 95 °F) is projected to increase by mid-century (2045–2054) under RCP8.5, roughly tripling relative to the modeled historical baseline. RCP8.5 is one high-emissions scenario, not a forecast, and the baseline is model output, not an observation."
  - n: 2
    item_id: BI-P2B-0003
    label: "California, rung 3"
    edited_prompt: "How is the summer frequency of days with a dangerous heat index (above 95 °F) expected to change in California by mid-century under RCP8.5, and what are the main physical drivers of this change?"
    edited_reference_integrated: "California is projected to see a moderate increase (about half again as many) in summer days with a dangerous heat index (above 95 °F) by mid-century (2045–2054) under RCP8.5, one high-emissions scenario. The main driver is large-scale warming rather than changes in regional atmospheric circulation; land–atmosphere feedbacks that sustain heat waves in the Southwest add to it, and one study suggests that night-time intensification of the urban heat island under calm, clear conditions contributes locally."
  - n: 3
    item_id: BI-P2B-0006
    label: "Alabama, rung 3"
    edited_prompt: "How is the summer frequency of days with a dangerous heat index (above 105 °F) expected to change in Alabama by the end of the century under RCP8.5, and what are the main physical drivers of this change?"
    edited_reference_integrated: "In Alabama, summer days with a dangerous heat index (above 105 °F) are projected to increase by the end of the century (2085–2094) under RCP8.5, more than tripling. The rise is driven primarily by large-scale warming, which increases the frequency, intensity and duration of heat waves. Because the heat index combines temperature and humidity, one study suggests the magnifying effect of humidity on heat stress grows as temperatures rise, and urban heat-island effects add to night-time heat in cities."
  - n: 4
    item_id: BI-P2B-0007
    label: "NCA5 regions, rung 4"
    edited_prompt: "How will the number of summer days with a dangerous heat index (above 95 °F) change by mid-century under RCP8.5 across the U.S. NCA5 climate regions — which region is projected to see the largest increase and which the smallest — and what are the main physical drivers?"
    edited_reference_integrated: "By mid-century (2045–2054) under RCP8.5, one high-emissions scenario, summer days with a dangerous heat index (above 95 °F) increase in every NCA5 climate region, with the largest increase in the Southeast and the smallest in Alaska. The increases are driven by large-scale warming; land–atmosphere feedbacks are a stronger factor for heat-wave maintenance at southern latitudes, and one study suggests that humidity magnifies heat stress more as temperatures rise."
  - n: 5
    item_id: BI-P2B-0010
    label: "Florida, rung 7, run 3"
    edited_prompt: "How is the number of summer days with a dangerous heat index (above 95 °F) in Florida expected to change by mid-century under a high-emissions scenario compared with a moderate one, and what are the main drivers and uncertainties?"
    edited_reference_integrated: "Under RCP8.5, one high-emissions scenario, Florida's summer days with a dangerous heat index (above 95 °F) are projected to roughly triple by mid-century (2045–2054). The main driver is large-scale warming, which raises heat-wave frequency, intensity and duration; one study suggests that humidity's magnifying effect on heat stress grows with temperature. The size of the change depends on the emissions pathway: one study reports heat-wave duration about one day longer under RCP8.5 than under the moderate RCP4.5 scenario, and no moderate-scenario projection of this quantity is available in the table used here, so the contrast rests on the literature alone. RCP8.5 should be read as one plausible high-emissions future, not a forecast."
